name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve media engine version
        shell: bash
        run: |
          set -o pipefail
          gradle :app:dependencyInsight \
            --dependency ffmpeg-kit-full-gpl \
            --configuration debugRuntimeClasspath 2>&1 | tee gradle-dependencies.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace --info 2>&1 | tee gradle-test.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ITthute-Media-Splitter-build-logs
          path: |
            gradle-dependencies.log
            gradle-test.log
            app/build/reports/tests/
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ITthute-Media-Splitter-debug
          path: app/build/outputs/apk/debug/app-debug.apk
