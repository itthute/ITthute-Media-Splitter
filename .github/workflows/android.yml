name: Android build

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and lint
        run: gradle --stacktrace assembleDebug lint
      - name: Verify FFmpeg runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:dependencies --configuration debugRuntimeClasspath > runtime-dependencies.txt
          grep -Fq 'com.arthenica:smart-exception-java:0.2.1' runtime-dependencies.txt
          grep -Fq 'com.arthenica:smart-exception-common:0.2.1' runtime-dependencies.txt

          APK='app/build/outputs/apk/debug/app-debug.apk'
          unzip -p "$APK" 'classes*.dex' | strings > packaged-dex-strings.txt
          grep -Fq 'Lcom/arthenica/smartexception/java/Exceptions;' packaged-dex-strings.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ITthute-Media-Splitter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ITthute-Media-Splitter-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
